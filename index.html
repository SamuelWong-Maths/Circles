.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn-green{background:#2ecc71}
.btn-blue{background:var(--secondary)}
.btn-gray{background:#95a5a6}
.btn-red{background:#e74c3c}
.btn-submit{background:#16a34a}
.workspace{display:flex;flex-direction:column;gap:28px;text-align:center}

.main-title{font-size:2.5rem;font-weight:800;color:var(--primary);margin:0 0 .2rem;line-height:1.08}
.sub-title{font-size:2rem;font-weight:700;margin:0 0 1rem;line-height:1.08}
#question-display{font-size:1.2rem;margin:8px 0 18px;min-height:72px;padding:8px;width:100%;text-align:center;line-height:1.55}
.choices{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;margin:10px auto 18px}
.choice{background:#f7f9fa;color:#2c3e50;border:2px solid #d6dde2;border-radius:10px;padding:14px 16px;cursor:pointer;transition:.2s;text-align:left}
.choice:hover{border-color:#3498db;background:#eef7fd}
.choice.selected{border-color:#3498db;background:#dff0fb}
.figure-card{width:100%;background:#f9fbfb;border:2px dashed #bdc3c7;border-radius:10px;padding:12px}
.figure-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mini-chip{background:#eef7fd;color:var(--primary);border-radius:999px;padding:6px 12px;font-size:.95rem;font-weight:700}
.tool-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tool-btn{width:auto;max-width:none;margin:0;padding:8px 12px;font-size:.9rem;border-radius:999px;border:2px solid #d6dde2;background:#fff;color:#2c3e50;cursor:pointer}
.tool-btn.active{border-color:#3498db;background:#eaf5fe}
.color-dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.15)}
.figure-stage{position:relative;width:100%;max-width:430px;margin:0 auto;aspect-ratio:1/1;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #d6dde2}
.figure-stage svg,.figure-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.figure-stage canvas{cursor:crosshair;touch-action:none}
.question-topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.help-note{font-size:.92rem;color:#64748b;text-align:center;margin-top:8px}

.modal-content{background:#fff;padding:28px;border-radius:12px;text-align:center;width:min(1020px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.2)}

.sol-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:1rem;line-height:1.55}
.sol-table td{vertical-align:top}
.sol-stmt{width:68%;padding-right:14px}
.sol-reason{width:32%;color:#555;text-align:left;white-space:nowrap}

.sol-note{margin:.2rem 0 .5rem;font-weight:600;color:#2c3e50}
.arc{position:relative;display:inline-block;padding:0 .08em .02em}
.arc:before{content:'';position:absolute;left:-.02em;right:-.02em;top:-.18em;height:.32em;border-top:1.6px solid currentColor;border-radius:60% 60% 0 0}
.small-note{color:#64748b;font-size:.95rem;max-width:760px;margin:8px auto 0}

    var x = ri(r === 1 ? 30 : r === 2 ? 25 : 15, r === 1 ? 55 : r === 2 ? 40 : 30);
    var arcRel = r === 1 ? `${arc('AB')} = ${arc('BC')}` : r === 2 ? `${arc('AB')} = 2${arc('BC')}` : `${arc('AB')} = 3${arc('BC')}`;
    var ADB = r * x;
    var ADC = (r + 1) * x;
    var ABC = 180 - ADC;
    var maxDBC = ABC - 20;
    var DBC = ri(20, maxDBC);
    var ABD = ABC - DBC;
    var t = ri(1, 2);
    
    var target = t === 1 ? '\u2220 BAD' : '\u2220 BCD';
    var ans = t === 1 ? 180 - ABD - ADB : 180 - DBC - x;
    
    var rows = [
        row('Let ∠BDC = x.'),
        row(`∠ADB = ${r === 1 ? 'x' : r === 2 ? '2x' : '3x'}`, 'arc prop. to ∠s at circumference'),
        gap(),
        row('In cyclic quadrilateral ABCD:'),
        row(`x + ${r === 1 ? 'x' : r === 2 ? '2x' : '3x'} + ${ABD}° + ${DBC}° = 180°`, 'opp. ∠s, cyclic quad.'),
        row(`x = ${x}°`),
        gap(),
        row(`In △${t === 1 ? 'ABD' : 'BCD'}:`),
        row(`${t === 1 ? '∠BAD' : '∠BCD'} = 180° − ${t === 1 ? ABD : DBC}° − ${t === 1 ? ADB : x}°`, '∠ sum of △'),
        row(`= ${ans}°`)
    ];
    
    var tilt = ri(-25, 25);
    var thB = 270 + tilt;
    var thC = thB + 2 * x;
    var thD = thC + 2 * DBC;
    var thA = thD + 2 * ABD;
    
    var pts = {
        B: polar(thB),
        C: polar(thC),
        D: polar(thD),
        A: polar(thA)
    };
    
    var fig = {
        points: pts,
        circle: { center: { x: cx, y: cy }, r: R },
        lines: [
            { a: 'A', b: 'B' }, { a: 'B', b: 'C' }, { a: 'C', b: 'D' },
            { a: 'D', b: 'A' }, { a: 'B', b: 'D' }
        ],
        labels: baseLabels(pts, ['A', 'B', 'C', 'D']),
        angles: [
            { a: 'D', v: 'B', b: 'A', label: `${ABD}°`, r: 22 },
            { a: 'C', v: 'B', b: 'D', label: `${DBC}°`, r: 16 }
        ]
    };
    
    return mk({
        typeId: 'circle_xviii',
        promptHtml: `In the figure, ${arcRel}, \\(\u2220 ABD=${ABD}^{\\circ}\\) and \\(\u2220 DBC=${DBC}^{\\circ}\\). Find \\(${target}\\).`,
        answer: ans,
        figure: fig,
        solutionFigure: fig,
        solutionRows: rows
    });
}

function g19() {
    var variation = ri(1, 3);
    var r, arcRel, rx, x, rsub;
    
    if (variation === 1) {
        r = 1;
        arcRel = `${arc('BC')} = ${arc('AB')}`;
        rx = 'x';
        x = ri(15, 40);
        rsub = `${x}°`;
    } else if (variation === 2) {
        r = 2;
        arcRel = `${arc('BC')} = 2${arc('AB')}`;
        rx = '2x';
        x = ri(15, 25);
        rsub = `2(${x}°)`;
    } else {
        r = 3;
        arcRel = `${arc('BC')} = 3${arc('AB')}`;
        rx = '3x';
        x = ri(10, 20);
        rsub = `3(${x}°)`;
    }
    
    var ABD = ri(30, 80);
    var BCD = ABD + x;
    var targetVar = ri(1, 3);
    var target = '';
    var ans = 0;
    var rows = [];
    
    if (targetVar === 1) {
        target = '\u2220 CBD';
        ans = 180 - BCD - r * x;
        rows = [
            row('Let ∠ADB = x.'),
            row(`∠BDC = ${rx}`, 'arc prop. to ∠s at circumference'),
            gap(),
            row('In △BCD:'),
            row(`∠CBD = 180° − ${rsub} − ${BCD}°`, '∠ sum of △'),
            row(`= ${ans}°`)
        ];
    }
    if (targetVar === 2) {
        target = '\u2220 BDC';
        ans = r * x;
        rows = [
            row('Let ∠ADB = x.'),
            row(`∠BDC = ${rx}`, 'arc prop. to ∠s at circumference'),
            row(`= ${ans}°`)
        ];
    }
    if (targetVar === 3) {
        target = '\u2220 ADC';
        ans = x + r * x;
        rows = [
            row('Let ∠ADB = x.'),
            row(`∠BDC = ${rx}`, 'arc prop. to ∠s at circumference'),
            gap(),
            row('∠ADC = ∠ADB + ∠BDC'),
            row(`= ${x}° + ${rsub}`),
            row(`= ${ans}°`)
        ];
    }
    
    var tilt = ri(-25, 25);
    var thD = 270 + tilt;
    var thA = thD + 2 * ABD;
    var thB = thA + 2 * x;
    var thC = thB + 2 * r * x;
    
    var pts = {
        D: polar(thD),
        A: polar(thA),
        B: polar(thB),
        C: polar(thC)
    };
    
    var fig = {
        points: pts,
        circle: { center: { x: cx, y: cy }, r: R },
        lines: [
            { a: 'A', b: 'B' }, { a: 'B', b: 'C' }, { a: 'C', b: 'D' },
            { a: 'D', b: 'A' }, { a: 'B', b: 'D' }
        ],
        labels: baseLabels(pts, ['A', 'B', 'C', 'D']),
        angles: [
            { a: 'D', v: 'B', b: 'A', label: `${ABD}°`, r: 20 },
            { a: 'D', v: 'C', b: 'B', label: `${BCD}°`, r: 20 }
        ]
    };
    
    return mk({
        typeId: 'circle_xix',
        promptHtml: `In the figure, ${arcRel}, \\(\u2220 ABD = ${ABD}^{\\circ}\\), and \\(\u2220 BCD = ${BCD}^{\\circ}\\). Find \\(${target}\\).`,
        answer: ans,
        figure: fig,
        solutionFigure: fig,
        solutionRows: rows
    });
}

function g20() {
    var pool = [[22.5, 4, 12], [24, 4, 11], [25, 5, 13], [30, 7, 14], [36, 5, 7.5], [40, 8, 10], [45, 6, 6], [60, 5, 2.5]];
    var set = pick(pool);
    var BDC = set[0];
    var BC = set[1];
    var AB = set[2];
    var ADB = 90 - BDC;
    var t = ri(1, 3);
    
    var target = '';
    var ans = 0;
    var rows = [];
    
    if (t === 1) {
        target = arc('AB');
        ans = AB;
        rows = [
            row(arc('AB') + '/' + arc('BC') + ' = ∠ADB/∠BDC', 'arc prop. to ∠s at circumference'),
            row(arc('AB') + '/' + BC + ' = ' + ADB + '°/' + BDC + '°'),
            row(arc('AB') + ' = ' + BC + ' × ' + ADB + '/' + BDC),
            row('= ' + ans)
        ];
    }
    if (t === 2) {
        target = arc('BC');
        ans = BC;
        rows = [
            row(arc('AB') + '/' + arc('BC') + ' = ∠ADB/∠BDC', 'arc prop. to ∠s at circumference'),
            row(AB + '/' + arc('BC') + ' = ' + ADB + '°/' + BDC + '°'),
            row(arc('BC') + ' = ' + AB + ' × ' + BDC + '/' + ADB),
            row('= ' + ans)
        ];
    }
    if (t === 3) {
        target = '\u2220 BDC';
        ans = BDC;
        rows = [
            row('Let ∠BDC = x.'),
            row('∠ADB = 90° − x'),
            gap(),
            row(arc('AB') + '/' + arc('BC') + ' = ∠ADB/∠BDC', 'arc prop. to ∠s at circumference'),
            row(AB + '/' + BC + ' = (90° − x)/x'),
            row(AB + 'x = ' + BC + '(90° − x)'),
            row((AB + BC) + 'x = ' + (BC * 90) + '°'),
            row('x = ' + ans + '°')
        ];
    }
    
    var tilt = ri(-25, 25);
    var thC = tilt;
    var thA = 180 + tilt;
    var thB = thC - 2 * BDC;
    var thD = tilt + ri(50, 130);
    
    var pts = {
        A: polar(thA),
        B: polar(thB),
        C: polar(thC),
        D: polar(thD)
    };
    
    var textsArr = t === 1 
        ? [{ x: polar(thC - BDC, R + 30).x, y: polar(thC - BDC, R + 30).y, text: String(BC) }] 
        : t === 2 
        ? [{ x: polar(tilt - 90 - BDC, R + 30).x, y: polar(tilt - 90 - BDC, R + 30).y, text: String(AB) }] 
        : [
            { x: polar(tilt - 90 - BDC, R + 30).x, y: polar(tilt - 90 - BDC, R + 30).y, text: String(AB) },
            { x: polar(thC - BDC, R + 30).x, y: polar(thC - BDC, R + 30).y, text: String(BC) }
        ];
        
    var fig = {
        points: pts,
        circle: { center: { x: cx, y: cy }, r: R },
        lines: [
            { a: 'A', b: 'C' }, { a: 'A', b: 'D' },
            { a: 'D', b: 'C' }, { a: 'D', b: 'B' }
        ],
        labels: baseLabels(pts, ['A', 'B', 'C', 'D']),
        angles: t !== 3 ? [{ a: 'B', v: 'D', b: 'C', label: `${BDC}°`, r: 30 }] : [],
        texts: textsArr,
        rightAngles: []
    };
    
    var sfig = JSON.parse(JSON.stringify(fig));
    sfig.rightAngles = [{ a: 'A', v: 'D', b: 'C' }];
    
    if (t !== 3) {
        rows.unshift(row('∠ADC = 90°', '∠ in semi-circle'));
        rows.splice(2, 0, gap(), row('∠ADB = ∠ADC − ∠BDC'), row(`= 90° − ${BDC}°`), row(`= ${ADB}°`), gap());
    } else {
        rows.unshift(row('∠ADC = 90°', '∠ in semi-circle'), gap());
    }
    
    var vals = (t === 3 ? [Math.max(2, ans - 4), ans, ans + 4, ans + 8] : [Math.max(1, ans - 2), ans, ans + 2, ans + 4]).sort(function(a, b) { return a - b; });
    
    var promptConditions = t === 1 
        ? `If \\(\u2220 BDC=${BDC}^{\\circ}\\) and ${arc('BC')} = ${BC}, find ${arc('AB')}.` 
        : t === 2 
        ? `If \\(\u2220 BDC=${BDC}^{\\circ}\\) and ${arc('AB')} = ${AB}, find ${arc('BC')}.` 
        : `If ${arc('AB')} = ${AB} and ${arc('BC')} = ${BC}, find \\(\u2220 BDC\\).`;
        
    return {
        typeId: 'circle_xx',
        promptHtml: `In the figure, \\(AC\\) is a diameter of the circle \\(ABCD\\). ${promptConditions}`,
        answer: ans,
        choices: vals.map(function(v) { return { tex: t === 3 ? String(v) + '^{\\circ}' : String(v) }; }),
        correctIndex: vals.findIndex(function(v) { return v === ans; }),
        figure: fig,
        solutionFigure: sfig,
        solutionRows: rows,
        points: 1
    };
}

function g21() {
    var half = ri(15, 40);
    var x = 2 * half;
    var base = 90 - half;
    var t = ri(1, 3);
    var tilt = ri(-25, 25);
    var thQ = 270 + tilt;
    var thR = thQ - 2 * x;
    var thS = thQ - 180 - x;
    var thT = thQ + ri(35, 70);
    
    var pts = {
        Q: polar(thQ),
        R: polar(thR),
        S: polar(thS),
        T: polar(thT)
    };
    pts.P = {
        x: pts.Q.x - 52 * Math.sin(thQ * Math.PI / 180),
        y: pts.Q.y - 52 * Math.cos(thQ * Math.PI / 180)
    };
    pts._pr = {
        x: pts.Q.x + 36 * Math.sin(thQ * Math.PI / 180),
        y: pts.Q.y + 36 * Math.cos(thQ * Math.PI / 180),
        show: false
    };
    
    var target = '';
    var ans = 0;
    var rows = [];
    
    if (t === 1) {
        target = '\u2220 QTS';
        ans = 90 + half;
        rows = [
            row(`∠QSR = ∠PQR = ${x}°`, '∠ in alt. segment'),
            gap(),
            row('In △RSQ:'),
            row('RS = SQ', 'given'),
            row(`∠SRQ = ∠RQS = (180° − ${x}°) ÷ 2 = ${base}°`, 'base ∠s, isos. △'),
            gap(),
            row('In RSTQ:'),
            row('∠QTS + ∠SRQ = 180°', 'opp. ∠s, cyclic quad.'),
            row(`∠QTS = 180° − ${base}° = ${ans}°`)
        ];
    }
    if (t === 2) {
        target = '\u2220 RQS';
        ans = base;
        rows = [
            row(`∠QSR = ∠PQR = ${x}°`, '∠ in alt. segment'),
            gap(),
            row('In △RSQ:'),
            row('RS = SQ', 'given'),
            row(`∠RQS = (180° − ${x}°) ÷ 2 = ${ans}°`, 'base ∠s, isos. △')
        ];
    }
    if (t === 3) {
        target = '\u2220 SRQ';
        ans = base;
        rows = [
            row(`∠QSR = ∠PQR = ${x}°`, '∠ in alt. segment'),
            gap(),
            row('In △RSQ:'),
            row('RS = SQ', 'given'),
            row(`∠SRQ = (180° − ${x}°) ÷ 2 = ${ans}°`, 'base ∠s, isos. △')
        ];
    }
    
    var fig = {
        points: pts,
        circle: { center: { x: cx, y: cy }, r: R },
        lines: [
            { a: 'P', b: '_pr' }, { a: 'R', b: 'S' }, { a: 'S', b: 'T' },
            { a: 'T', b: 'Q' }, { a: 'Q', b: 'R' }, { a: 'S', b: 'Q' }
        ],
        ticks: [{ a: 'R', b: 'S', count: 2 }, { a: 'S', b: 'Q', count: 2 }],
        labels: baseLabels(pts, ['Q', 'R', 'S', 'T']).concat([{ x: pts.P.x, y: pts.P.y + 12, text: 'P' }]),
        angles: [{ a: 'R', v: 'Q', b: 'P', label: `${x}°`, r: 18 }]
    };
    
    return mk({
        typeId: 'circle_xxi',
        promptHtml: `In the figure, \\(PQ\\) is the tangent to the circle at \\(Q\\). \\(\u2220 PQR=${x}^{\\circ}\\) and \\(RS=SQ\\). Find \\(${target}\\).`,
        answer: ans,
        figure: fig,
        solutionFigure: fig,
        solutionRows: rows
    });
}

function g22() {
    var half = ri(20, 50);
    var x = 2 * half;
    var minY = x + 15;
    var maxY = 55 + half;
    var y = ri(minY, maxY);
    var z = 90 + half - y;
    var t = ri(1, 3);
    var tilt = ri(-25, 25);
    var thP = 240 + tilt;
    var thQ = thP + x;
    var thR = thQ + 2 * z;
    var thS = thR + ri(25, 50);
    
    var pts = {
        O: { x: cx, y: cy },
        P: polar(thP),
        Q: polar(thQ),
        R: polar(thR),
        S: polar(thS)
    };
    pts.T = lineIntersection(pts.P, pts.R, pts.O, pts.Q);
    
    var target = '';
    var given = '';
    var ans = 0;
    var rows = [];
    
    if (t === 1) {
        target = '\u2220 QSR';
        given = `\\(\u2220 POT=${x}^{\\circ}\\) and \\(\u2220 PTQ=${y}^{\\circ}\\)`;
        ans = z;
        rows = [
            row('Join PQ.'),
            gap(),
            row('In △OPQ:'),
            row('OP = OQ', 'radii'),
            row('∠OPQ = ∠OQP', 'base ∠s, isos. △'),
            row(`∠OQP = (180° − ${x}°) ÷ 2 = ${90 - half}°`, '∠ sum of △'),
            gap(),
            row('In △PQT:'),
            row(`∠TPQ + ${y}° + ${90 - half}° = 180°`, '∠ sum of △'),
            row(`∠TPQ = ${ans}°`),
            gap(),
            row(`∠QSR = ∠TPQ = ${ans}°`, '∠s in the same segment')
        ];
    }
    if (t === 2) {
        target = '\u2220 PTQ';
        given = `\\(\u2220 POT=${x}^{\\circ}\\) and \\(\u2220 QSR=${z}^{\\circ}\\)`;
        ans = y;
        rows = [
            row('Join PQ.'),
            gap(),
            row(`∠TPQ = ∠QSR = ${z}°`, '∠s in the same segment'),
            gap(),
            row('In △OPQ:'),
            row('OP = OQ', 'radii'),
            row(`∠OQP = (180° − ${x}°) ÷ 2 = ${90 - half}°`, 'base ∠s, isos. △'),
            gap(),
            row('In △PQT:'),
            row(`∠PTQ + ${z}° + ${90 - half}° = 180°`, '∠ sum of △'),
            row(`∠PTQ = ${ans}°`)
        ];
    }
    if (t === 3) {
        target = '\u2220 POQ';
        given = `\\(\u2220 PTQ=${y}^{\\circ}\\) and \\(\u2220 QSR=${z}^{\\circ}\\)`;
        ans = x;
        rows = [
            row('Join PQ.'),
            gap(),
            row(`∠TPQ = ∠QSR = ${z}°`, '∠s in the same segment'),
            gap(),
            row('In △PQT:'),
            row(`∠TQP + ${y}° + ${z}° = 180°`, '∠ sum of △'),
            row(`∠TQP = ${90 - half}°`),
            gap(),
            row('In △OPQ:'),
            row('OP = OQ', 'radii'),
            row(`∠OPQ = ∠OQP = ${90 - half}°`, 'base ∠s, isos. △'),
            row(`∠POQ = 180° − ${90 - half}° − ${90 - half}° = ${ans}°`, '∠ sum of △')
        ];
    }
    
    var angs = [];
    if (t === 1) {
        angs.push({ a: 'P', v: 'O', b: 'T', label: `${x}°`, r: 18 }, { a: 'P', v: 'T', b: 'Q', label: `${y}°`, r: 20 });
    }
    if (t === 2) {
        angs.push({ a: 'P', v: 'O', b: 'T', label: `${x}°`, r: 18 }, { a: 'Q', v: 'S', b: 'R', label: `${z}°`, r: 20 });
    }
    if (t === 3) {
        angs.push({ a: 'P', v: 'T', b: 'Q', label: `${y}°`, r: 20 }, { a: 'Q', v: 'S', b: 'R', label: `${z}°`, r: 20 });
    }
    
    var fig = {
        points: pts,
        circle: { center: pts.O, r: R },
        lines: [
            { a: 'P', b: 'O' }, { a: 'O', b: 'Q' }, { a: 'P', b: 'R' },
            { a: 'Q', b: 'S' }, { a: 'R', b: 'S' }
        ],
        labels: baseLabels(pts, ['O', 'P', 'Q', 'R', 'S']).concat([{ x: pts.T.x + 10, y: pts.T.y + 10, text: 'T' }]),
        angles: angs
    };
    
    var sfig = JSON.parse(JSON.stringify(fig));
    sfig.lines = fig.lines.concat([{ a: 'P', b: 'Q', color: 'red' }]);
    
    return mk({
        typeId: 'circle_xxii',
        promptHtml: `In the figure, \\(O\\) is the centre of the circle \\(PQRS\\). \\(PR\\) and \\(OQ\\) intersect at the point \\(T\\). If ${given}, find \\(${target}\\).`,
        answer: ans,
        figure: fig,
        solutionFigure: sfig,
        solutionRows: rows
    });
}

var gens = {
    circle_i: g1, circle_ii: g2, circle_iii: g3, circle_iv: g4,
    circle_v: g5, circle_vi: g6, circle_vii: g7, circle_viii: g8,
    circle_ix: g9, circle_x: g10, circle_xi: g11, circle_xii: g12,
    circle_xiii: g13, circle_xiv: g14, circle_xv: g15, circle_xvi: g16,
    circle_xvii: g17, circle_xviii: g18, circle_xix: g19, circle_xx: g20,
    circle_xxi: g21, circle_xxii: g22
};

function randomType(exclude){var keys=Object.keys(gens).filter(function(k){return k!==exclude});return pick(keys)}
function startRandomQuestion(){renderQuestion(gens[randomType('')]())}
function startSimilarQuestion(){if(currentQuestion&&gens[currentQuestion.typeId])renderQuestion(gens[currentQuestion.typeId]())}
function startOtherQuestion(){renderQuestion(gens[randomType(currentQuestion?currentQuestion.typeId:'')]())}

function renderQuestion(q){
  currentQuestion=q;
  selectedChoice=null;
  questionSeconds=0;
  $('menu-screen').classList.add('hidden');
  $('question-screen').classList.remove('hidden');
  $('question-display').innerHTML=q.promptHtml;
  safeTypeset($('question-display'));
  var wrap=$('choices');
  wrap.innerHTML='';
  (q.choices||[]).forEach(function(ch,i){
    var d=document.createElement('div');
    d.className='choice';
    d.innerHTML='\\('+ch.tex+'\\)';
    d.addEventListener('click',function(){
      selectedChoice=i;
      Array.prototype.forEach.call(wrap.children,function(el){el.classList.remove('selected')});
      d.classList.add('selected');
    });
    wrap.appendChild(d);
  });
  safeTypeset(wrap);
  renderFigure('question-figure',q.figure);
  clearCanvas();
  updateScore();
}

function makeBtn(text,cls,fn){var b=document.createElement('button');b.className='btn '+cls;b.type='button';b.textContent=text;b.addEventListener('click',fn);return b}

function showFeedback(ok){
  $('feedback-title').textContent=ok?'Well done!':'Oops! Something is wrong.';
  $('feedback-title').style.color=ok?'var(--success)':'var(--danger)';
  $('feedback-message').textContent=ok?'This is the correct answer. Here is the solution.':'Here is the solution. Please study it carefully.';
  $('solution-math').innerHTML=renderSolution(currentQuestion);
  renderFigure('solution-figure',currentQuestion.solutionFigure||currentQuestion.figure);
  safeTypeset($('solution-math'));
  var actions=$('feedback-actions');
  actions.innerHTML='';
  if(ok){
    actions.appendChild(makeBtn('Back to menu','btn-blue',function(){closeFeedback();returnToMenu()}));
    actions.appendChild(makeBtn('Try other questions','btn-green',function(){closeFeedback();startOtherQuestion()}));
  }else{
    actions.appendChild(makeBtn('Try a similar question','btn-green',function(){closeFeedback();startSimilarQuestion()}));
    actions.appendChild(makeBtn('Try other questions','btn-blue',function(){closeFeedback();startOtherQuestion()}));
    actions.appendChild(makeBtn('Back to menu','btn-gray',function(){closeFeedback();returnToMenu()}));
  }
  $('feedback-modal').classList.remove('hidden');
}

function closeFeedback(){$('feedback-modal').classList.add('hidden')}

function logAnswer(ok){
  if(!currentQuestion||selectedChoice===null)return;
  var selected=currentQuestion.choices[selectedChoice]?currentQuestion.choices[selectedChoice].tex:'';
  answerLog.push({
    question: currentQuestion.promptText || sanitizeText(currentQuestion.promptHtml),
    answer: selected,
    type: 'multiple-choice',
    correct: ok ? 'yes' : 'no'
  });
}

function checkAnswer(){
  if(selectedChoice===null||!currentQuestion){alert('Please choose an answer first.');return}
  var ok=selectedChoice===currentQuestion.correctIndex;
  if(ok)currentScore+=currentQuestion.points||1;
  logAnswer(ok);
  showFeedback(ok);
  updateScore();
}

function returnToMenu(){$('question-screen').classList.add('hidden');$('menu-screen').classList.remove('hidden');updateScore()}
function updateScore(){if($('score-display'))$('score-display').textContent=currentScore;if($('overall-timer'))$('overall-timer').textContent=fmt(totalSeconds);if($('question-timer'))$('question-timer').textContent=fmt(questionSeconds)}
function resetAll(){currentScore=0;totalSeconds=0;questionSeconds=0;currentQuestion=null;selectedChoice=null;answerLog=[];submittedResults=false;closeFeedback();returnToMenu();clearCanvas();updateScore();alert('Score and answer log reset.')}

function submitResults(){
  if(answerLog.length===0){alert('No results to submit yet.');return}
  if(submittedResults){alert('Results already submitted.');return}
  
  var payload={responses:answerLog.map(function(item){return{question:item.question,answer:item.answer,type:item.type}})};
  
  // Check if we are actually running inside the Google Apps Script environment
  if(typeof google !== 'undefined' && google.script && google.script.run){
    google.script.run
      .withSuccessHandler(function(result) {
         submittedResults=true;
         alert('Results submitted successfully.');
      })
      .withFailureHandler(function(error) {
         alert('Submission failed: ' + (error && error.message ? error.message : String(error)));
      })
      .processQuizResults(payload); 
  } else {
    alert('Running outside Google Apps Script environment. Your quiz works, but results submission is unavailable here.');
  }
}

function initCanvas(){canvas=$('draw-canvas');if(!canvas)return;ctx=canvas.getContext('2d');resizeCanvas();setColor(currentColor);setTool('pen');['pointerdown','pointermove','pointerup','pointercancel','pointerout'].forEach(function(ev){canvas.addEventListener(ev,handlePointer,{passive:false})});window.addEventListener('resize',resizeCanvas)}
function resizeCanvas(){if(!canvas||!ctx)return;var temp=document.createElement('canvas');temp.width=canvas.width||0;temp.height=canvas.height||0;if(temp.width&&temp.height){try{temp.getContext('2d').drawImage(canvas,0,0)}catch(e){}}canvas.width=canvas.offsetWidth||430;canvas.height=canvas.offsetHeight||430;ctx.lineCap='round';ctx.lineJoin='round';if(temp.width&&temp.height){try{ctx.drawImage(temp,0,0)}catch(e){}}}
function clearCanvas(){if(ctx&&canvas)ctx.clearRect(0,0,canvas.width,canvas.height)}
function setTool(t){currentTool=t;if($('tool-pen'))$('tool-pen').classList.toggle('active',t==='pen');if($('tool-eraser'))$('tool-eraser').classList.toggle('active',t==='eraser')}
function setColor(c){currentColor=c;COLORS.forEach(function(v,i){var el=$('color-'+i);if(el)el.classList.toggle('active',v===c)});if(!ctx)return;ctx.globalCompositeOperation='source-over';ctx.strokeStyle=currentColor;ctx.lineWidth=3}
function getPosFromClient(clientX,clientY){var r=canvas.getBoundingClientRect();return{x:clientX-r.left,y:clientY-r.top}}
function resetPause(){clearTimeout(pauseTimer);pauseTimer=setTimeout(function(){if(!isDrawing||currentTool==='eraser'||!startPt||!lastPt||!ctx)return;var dist=Math.hypot(lastPt.x-startPt.x,lastPt.y-startPt.y);if(dist<8)return;ctx.putImageData(strokeSnapshot,0,0);ctx.globalCompositeOperation='source-over';ctx.strokeStyle=currentColor;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(startPt.x,startPt.y);ctx.lineTo(lastPt.x,lastPt.y);ctx.stroke();lockedLine=true},260)}
function endStroke(){clearTimeout(pauseTimer);isDrawing=false;if(ctx)ctx.beginPath();startPt=null;lastPt=null;strokeSnapshot=null;lockedLine=false}
function handleDrawPoint(p){if(!ctx||!canvas)return;if(!lockedLine){if(currentTool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=18}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=currentColor;ctx.lineWidth=3}ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)}}
function handlePointer(e){if(!canvas||!ctx)return;e.preventDefault();var p;if(e.touches&&e.touches[0]){p=getPosFromClient(e.touches[0].clientX,e.touches[0].clientY)}else if(e.changedTouches&&e.changedTouches[0]){p=getPosFromClient(e.changedTouches[0].clientX,e.changedTouches[0].clientY)}else{p=getPosFromClient(e.clientX,e.clientY)}if(e.type==='pointerdown'){isDrawing=true;lockedLine=false;startPt=p;lastPt=p;strokeSnapshot=ctx.getImageData(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.moveTo(p.x,p.y);resetPause()}else if(e.type==='pointermove'&&isDrawing){if(lockedLine)return;lastPt=p;handleDrawPoint(p);resetPause()}else{endStroke()}}
function bind(id,event,fn){var el=$(id);if(el)el.addEventListener(event,fn)}

function init(){
  if(initialized)return;
  initialized=true;
  initCanvas();
  bind('start-btn','click',startRandomQuestion);
  bind('submit-btn','click',checkAnswer);
  bind('back-menu-btn','click',returnToMenu);
  bind('clear-all-btn','click',clearCanvas);
  // Removed bindings for submitResults and resetAll
  bind('tool-pen','click',function(){setTool('pen')});
  bind('tool-eraser','click',function(){setTool('eraser')});
  COLORS.forEach(function(c,i){bind('color-'+i,'click',function(){setColor(c)})});
  if(!timerHandle){timerHandle=setInterval(function(){totalSeconds++;if($('question-screen')&&!$('question-screen').classList.contains('hidden'))questionSeconds++;updateScore()},1000)}
  updateScore();
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
window.addEventListener('load',init);
})();
</script>
